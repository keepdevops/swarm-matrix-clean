name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # Runtime deps (httpx, pydantic). Optional engine deps stay commented.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Syntax check (all .py files)
        run: |
          python -c "
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part.startswith('.') for part in p.parts): continue
              try: ast.parse(p.read_text())
              except SyntaxError as e: bad.append(f'{p}: {e}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('syntax OK')
          "

      - name: LOC check (250-300 rule, soft warn at 300)
        run: |
          python -c "
          import pathlib
          fail = False
          for p in sorted(pathlib.Path('backends').rglob('*.py')) + \
                   sorted(pathlib.Path('orchestration').rglob('*.py')) + \
                   [pathlib.Path('run_agent.py')]:
              loc = sum(1 for _ in p.open())
              tag = 'OVER' if loc > 300 else ('warn' if loc > 280 else 'ok')
              print(f'{tag:>4}  {p}  {loc} LOC')
              if loc > 300: fail = True
          import sys; sys.exit(1 if fail else 0)
          "

      - name: Run fast test suite
        run: pytest -v

      - name: Verify CLI entry point
        run: python run_agent.py --list-backends

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check backends orchestration tests run_agent.py
      - name: ruff format check
        run: ruff format --check backends orchestration tests run_agent.py
